---
# Catalyst Center connection defaults.
catalystcenter_host: ""
catalystcenter_username: ""
catalystcenter_password: ""
catalystcenter_verify: false
catalystcenter_port: 443
catalystcenter_version: "2.3.7.9"
catalystcenter_debug: false
catalystcenter_log_level: INFO
catalystcenter_log: false
catalystcenter_log_append: false
catalystcenter_log_file_path: catalystcenter.log

# Public workflow controls.
switch_refresh_sda_fabric_distribution_phase: prepare
switch_refresh_sda_fabric_distribution_batches: []
switch_refresh_sda_fabric_distribution_cleanup_old: false
switch_refresh_sda_fabric_distribution_onboarding_method: discovery

# Individual stages may be disabled only for a deliberate resume after their
# postconditions have already been established.
switch_refresh_sda_fabric_distribution_discovery_enabled: true
switch_refresh_sda_fabric_distribution_lan_automation_enabled: true
switch_refresh_sda_fabric_distribution_inventory_enabled: true
switch_refresh_sda_fabric_distribution_provision_enabled: true
switch_refresh_sda_fabric_distribution_cleanup_unprovision_enabled: true
switch_refresh_sda_fabric_distribution_cleanup_inventory_enabled: true

# Workflow-manager verification and bounded convergence controls.
switch_refresh_sda_fabric_distribution_discovery_config_verify: false
switch_refresh_sda_fabric_distribution_provision_config_verify: false
switch_refresh_sda_fabric_distribution_inventory_readiness_timeout: 1200
switch_refresh_sda_fabric_distribution_inventory_readiness_poll_interval: 10
switch_refresh_sda_fabric_distribution_provision_validation_timeout: 1200
switch_refresh_sda_fabric_distribution_provision_validation_poll_interval: 10
switch_refresh_sda_fabric_distribution_lan_automation_task_timeout: 604800
switch_refresh_sda_fabric_distribution_lan_automation_task_poll_interval: 30
switch_refresh_sda_fabric_distribution_topology_validation_timeout: 600
switch_refresh_sda_fabric_distribution_topology_validation_poll_interval: 10
switch_refresh_sda_fabric_distribution_device_lookup_timeout: 120
switch_refresh_sda_fabric_distribution_device_lookup_retries: 6
switch_refresh_sda_fabric_distribution_device_lookup_interval: 10

# Optional hostname transfer. The manifest directory is intentionally unset:
# destructive cleanup cannot start without an explicit durable location.
switch_refresh_sda_fabric_distribution_hostname_transfer_enabled: false
switch_refresh_sda_fabric_distribution_hostname_transfer_resume_from_manifest: false
switch_refresh_sda_fabric_distribution_hostname_transfer_manifest_dir: ""
switch_refresh_sda_fabric_distribution_hostname_transfer_timeout: 1200
switch_refresh_sda_fabric_distribution_hostname_transfer_poll_interval: 10
switch_refresh_sda_fabric_distribution_hostname_validation_retries: 12
switch_refresh_sda_fabric_distribution_hostname_validation_interval: 10
