---
- name: Validate prepare input for switch refresh item
  ansible.builtin.assert:
    that:
      - refresh_item.fabric_site_name_hierarchy is defined
      - refresh_item.old is defined
      - refresh_item.new is defined
      - refresh_item.old.management_ip is defined or refresh_item.old.hostname is defined or refresh_item.old.serial_number is defined or refresh_item.old.mac_address is defined
      - refresh_item.new.management_ip is defined or refresh_item.new.discovery_ip is defined or refresh_item.new.discovery_config is defined
    fail_msg: >-
      Each switch_refresh_devices entry needs fabric_site_name_hierarchy, an old
      device identifier (management_ip, hostname, serial_number, or mac_address),
      and a new management IP, discovery IP, or discovery_config. For
      LAN Automation onboarding, new.management_ip should be the expected
      management IP after LAN Automation completes.

- name: Set replacement switch onboarding method
  ansible.builtin.set_fact:
    switch_refresh_item_onboarding_method: "{{ refresh_item.onboarding_method | default(switch_refresh_onboarding_method) }}"

- name: Validate replacement switch onboarding method
  ansible.builtin.assert:
    that:
      - switch_refresh_item_onboarding_method in ['discovery', 'lan_automation']
    fail_msg: >-
      onboarding_method must be discovery or lan_automation for
      {{ refresh_item.name | default('switch refresh item') }}.

- name: Prevent LAN Automation completion barrier bypass
  ansible.builtin.assert:
    that:
      - switch_refresh_lan_automation_enabled | bool
    fail_msg: >-
      switch_refresh_lan_automation_enabled must be true when
      onboarding_method=lan_automation. Otherwise the prepare flow could reach
      inventory and provisioning without launching and waiting for LAN
      Automation.
  when: switch_refresh_item_onboarding_method == 'lan_automation'

- name: Validate replacement switch LAN Automation config
  ansible.builtin.assert:
    that:
      - refresh_item.new.lan_automation_config is defined
      - (refresh_item.new.lan_automation_config | type_debug) == 'list'
      - refresh_item.new.lan_automation_config | length == 1
      - refresh_item.new.lan_automation_config[0] is mapping
      - >-
        (refresh_item.new.lan_automation_config[0].keys() | list | sort)
        == ['lan_automation']
      - refresh_item.new.lan_automation_config[0].lan_automation is mapping
    fail_msg: >-
      new.lan_automation_config must be a launch-only list containing exactly
      one mapping whose only key is lan_automation. Device updates and port
      channels must run after the completion barrier for
      {{ refresh_item.name | default('switch refresh item') }}.
  when:
    - switch_refresh_item_onboarding_method == 'lan_automation'
    - switch_refresh_lan_automation_enabled | bool

- name: Store replacement switch LAN Automation session
  ansible.builtin.set_fact:
    switch_refresh_item_lan_automation_session: >-
      {{ refresh_item.new.lan_automation_config[0].lan_automation }}
  when:
    - switch_refresh_item_onboarding_method == 'lan_automation'
    - switch_refresh_lan_automation_enabled | bool

- name: Require LAN Automation manager to wait for its start task
  ansible.builtin.assert:
    that:
      - (refresh_item.new.lan_automation_state | default('merged')) == 'merged'
      - switch_refresh_item_lan_automation_session.launch_and_wait is defined
      - (switch_refresh_item_lan_automation_session.launch_and_wait | default(false) | type_debug) == 'bool'
      - switch_refresh_item_lan_automation_session.launch_and_wait | default(false)
    fail_msg: >-
      Switch refresh requires lan_automation_state: merged and an explicit
      boolean launch_and_wait: true inside the single lan_automation entry.
      The role adds a separate active-session completion barrier before any
      downstream workflow.
  when:
    - switch_refresh_item_onboarding_method == 'lan_automation'
    - switch_refresh_lan_automation_enabled | bool

- name: Seed replacement switch management IP
  ansible.builtin.set_fact:
    switch_refresh_new_management_ip: "{{ refresh_item.new.management_ip | default(refresh_item.new.discovery_ip | default('')) }}"

- name: Derive replacement switch management IP from flat discovery config
  ansible.builtin.set_fact:
    switch_refresh_new_management_ip: >-
      {{ refresh_item.new.discovery_config[0].ip_address_list[0] }}
  when:
    - switch_refresh_new_management_ip | length == 0
    - refresh_item.new.discovery_config is defined
    - (refresh_item.new.discovery_config | type_debug) == 'list'
    - refresh_item.new.discovery_config | length > 0
    - refresh_item.new.discovery_config[0].ip_address_list is defined
    - refresh_item.new.discovery_config[0].ip_address_list | length > 0

- name: Derive replacement switch management IP from legacy discovery config
  ansible.builtin.set_fact:
    switch_refresh_new_management_ip: "{{ refresh_item.new.discovery_config.single[0].ip_address_list[0] }}"
  when:
    - switch_refresh_new_management_ip | length == 0
    - refresh_item.new.discovery_config is defined
    - refresh_item.new.discovery_config.single is defined
    - refresh_item.new.discovery_config.single | length > 0
    - refresh_item.new.discovery_config.single[0].ip_address_list is defined
    - refresh_item.new.discovery_config.single[0].ip_address_list | length > 0

- name: Validate replacement switch management IP is known
  ansible.builtin.assert:
    that:
      - switch_refresh_new_management_ip | length > 0
    fail_msg: >-
      Unable to determine the replacement switch management IP. Set
      new.management_ip, new.discovery_ip, or include a SINGLE discovery config
      with ip_address_list.

- name: Build switch refresh prepare context
  ansible.builtin.set_fact:
    switch_refresh_item_name: "{{ refresh_item.name | default(refresh_item.new.hostname | default(switch_refresh_new_management_ip)) }}"
    switch_refresh_item_file_safe_name: "{{ refresh_item.name | default(refresh_item.new.hostname | default(switch_refresh_new_management_ip)) | regex_replace('[^A-Za-z0-9_.-]', '_') }}"
    switch_refresh_migration_output_file: "{{ refresh_item.migration_output_file | default(switch_refresh_work_dir ~ '/' ~ (refresh_item.name | default(refresh_item.new.hostname | default(switch_refresh_new_management_ip)) | regex_replace('[^A-Za-z0-9_.-]', '_')) ~ '_host_port_migration.yml') }}"
    switch_refresh_port_assignment_interface_mappings: "{{ refresh_item.port_assignment_interface_mappings | default(refresh_item.interface_mappings | default([])) }}"
    switch_refresh_port_channel_interface_mappings: "{{ refresh_item.port_channel_interface_mappings | default(refresh_item.interface_mappings | default([])) }}"

- name: Build replacement switch discovery configuration
  ansible.builtin.set_fact:
    switch_refresh_new_discovery_config: >-
      {{
        refresh_item.new.discovery_config
        if (
          refresh_item.new.discovery_config is defined and
          (refresh_item.new.discovery_config | type_debug) == 'list'
        )
        else refresh_item.new.discovery_config.single
        if (
          refresh_item.new.discovery_config is defined and
          refresh_item.new.discovery_config.single is defined
        )
        else [
            {
              'discovery_name': refresh_item.new.discovery_name | default('switch-refresh-' ~ switch_refresh_item_file_safe_name),
              'discovery_type': 'SINGLE',
              'ip_address_list': [switch_refresh_new_management_ip],
              'protocol_order': refresh_item.new.protocol_order | default('ssh'),
              'retry': refresh_item.new.discovery_retry | default(2),
              'use_global_credentials': refresh_item.new.use_global_credentials | default(true)
            }
        ]
      }}
  when:
    - switch_refresh_item_onboarding_method == 'discovery'
    - switch_refresh_discovery_enabled | bool
  no_log: true

- name: Validate replacement switch discovery configuration
  ansible.builtin.assert:
    that:
      - (switch_refresh_new_discovery_config | type_debug) == 'list'
      - switch_refresh_new_discovery_config | length > 0
    fail_msg: >-
      Legacy new.discovery_config must be a flat workflow-manager list. The
      previously documented single list wrapper is also accepted and flattened.
  when:
    - switch_refresh_item_onboarding_method == 'discovery'
    - switch_refresh_discovery_enabled | bool

- name: Build old switch inventory identifier
  ansible.builtin.set_fact:
    switch_refresh_old_device_identifier: >-
      {{
        {'ip_address': [refresh_item.old.management_ip]} if (refresh_item.old.management_ip is defined) else
        {'hostname': [refresh_item.old.hostname]} if (refresh_item.old.hostname is defined) else
        {'serial_number': [refresh_item.old.serial_number]} if (refresh_item.old.serial_number is defined) else
        {'mac_address': [refresh_item.old.mac_address]} if (refresh_item.old.mac_address is defined) else
        {}
      }}

- name: Resolve old switch inventory details
  ansible.builtin.include_role:
    name: network_devices_info
    apply:
      tags:
        - switch_refresh_prepare
  vars:
    network_devices_info_state: gathered
    network_devices_info_config_verify: false
    network_devices_info_config:
      - network_devices:
          - device_identifier:
              - "{{ switch_refresh_old_device_identifier }}"
            timeout: "{{ refresh_item.device_info_lookup_timeout | default(switch_refresh_device_info_lookup_timeout) }}"
            retries: "{{ refresh_item.device_info_lookup_retries | default(switch_refresh_device_info_lookup_retries) }}"
            interval: "{{ refresh_item.device_info_lookup_interval | default(switch_refresh_device_info_lookup_interval) }}"
            requested_info:
              - device_info
  when: switch_refresh_device_info_lookup_enabled | bool

- name: Validate old switch inventory lookup result
  ansible.builtin.assert:
    that:
      - network_devices_info_result.response is defined
      - network_devices_info_result.response | length > 1
      - network_devices_info_result.response[1] | length > 0
      - network_devices_info_result.response[1][0].device_info is defined
      - network_devices_info_result.response[1][0].device_info | length == 1
      - network_devices_info_result.response[1][0].device_info[0].device_details | length == 1
    fail_msg: >-
      Unable to resolve exactly one old switch from Catalyst Center inventory
      using {{ switch_refresh_old_device_identifier }}.
  when: switch_refresh_device_info_lookup_enabled | bool

- name: Set old switch resolved details
  ansible.builtin.set_fact:
    switch_refresh_old_device_details: "{{ network_devices_info_result.response[1][0].device_info[0].device_details[0] }}"
  when: switch_refresh_device_info_lookup_enabled | bool

- name: Set old switch management IP
  ansible.builtin.set_fact:
    switch_refresh_old_management_ip: >-
      {{
        refresh_item.old.management_ip if (refresh_item.old.management_ip is defined)
        else (switch_refresh_old_device_details.managementIpAddress | default(''))
      }}

- name: Validate old switch management IP is known
  ansible.builtin.assert:
    that:
      - switch_refresh_old_management_ip | length > 0
    fail_msg: >-
      Unable to determine the old switch management IP. Provide old.management_ip
      or enable inventory lookup with hostname, serial_number, or mac_address.

- name: Discover replacement switch
  ansible.builtin.include_role:
    name: discovery
    apply:
      tags:
        - switch_refresh_prepare
  vars:
    discovery_state: merged
    discovery_config_verify: "{{ switch_refresh_discovery_config_verify }}"
    discovery_config: "{{ switch_refresh_new_discovery_config }}"
  when:
    - switch_refresh_item_onboarding_method == 'discovery'
    - switch_refresh_discovery_enabled | bool

- name: Run LAN Automation for replacement switch
  ansible.builtin.include_role:
    name: lan_automation
    apply:
      tags:
        - switch_refresh_prepare
  vars:
    lan_automation_state: "{{ refresh_item.new.lan_automation_state | default('merged') }}"
    lan_automation_config_verify: "{{ refresh_item.new.lan_automation_config_verify | default(switch_refresh_lan_automation_config_verify) }}"
    lan_automation_catalystcenter_api_task_timeout: "{{ switch_refresh_lan_automation_completion_timeout }}"
    lan_automation_catalystcenter_task_poll_interval: "{{ switch_refresh_lan_automation_completion_poll_interval }}"
    lan_automation_config: "{{ refresh_item.new.lan_automation_config }}"
  when:
    - switch_refresh_item_onboarding_method == 'lan_automation'
    - switch_refresh_lan_automation_enabled | bool

- name: Wait until LAN Automation is fully inactive
  ansible.builtin.include_tasks: wait_for_lan_automation.yml
  when: switch_refresh_item_onboarding_method == 'lan_automation'

- name: Set replacement switch inventory credentials
  ansible.builtin.set_fact:
    switch_refresh_new_inventory_credentials: >-
      {{
        refresh_item.new.inventory_credentials |
        default(switch_refresh_inventory_credentials)
      }}
  when: switch_refresh_inventory_enabled | bool

- name: Validate replacement switch inventory input
  ansible.builtin.assert:
    that:
      - >-
        refresh_item.new.inventory_config is defined or
        (
          switch_refresh_new_inventory_credentials.username is defined and
          switch_refresh_new_inventory_credentials.password is defined
        )
    fail_msg: >-
      Adding the replacement switch through the inventory role requires either
      new.inventory_config or inventory credentials containing username and
      password. Set switch_refresh_inventory_credentials globally or
      new.inventory_credentials for this switch.
  when: switch_refresh_inventory_enabled | bool

- name: Build replacement switch inventory configuration
  ansible.builtin.set_fact:
    switch_refresh_new_inventory_config: >-
      {{
        refresh_item.new.inventory_config | default([
          (
            {
              'ip_address_list': [switch_refresh_new_management_ip],
              'type': 'NETWORK_DEVICE',
              'cli_transport': 'ssh'
            } | combine(switch_refresh_new_inventory_credentials)
          )
        ])
      }}
  when: switch_refresh_inventory_enabled | bool

- name: Add replacement switch to Catalyst Center inventory
  ansible.builtin.include_role:
    name: inventory
    apply:
      tags:
        - switch_refresh_prepare
  vars:
    inventory_state: merged
    inventory_config_verify: "{{ switch_refresh_inventory_config_verify }}"
    inventory_config: "{{ switch_refresh_new_inventory_config }}"
  when: switch_refresh_inventory_enabled | bool

- name: Set replacement switch inventory role
  ansible.builtin.include_role:
    name: inventory
    apply:
      tags:
        - switch_refresh_prepare
  vars:
    inventory_state: merged
    inventory_config_verify: "{{ switch_refresh_inventory_config_verify }}"
    inventory_config:
      - ip_address_list:
          - "{{ switch_refresh_new_management_ip }}"
        role: ACCESS
  when: switch_refresh_inventory_role_update_enabled | bool

- name: Resolve replacement switch inventory details
  ansible.builtin.include_role:
    name: network_devices_info
    apply:
      tags:
        - switch_refresh_prepare
  vars:
    network_devices_info_state: gathered
    network_devices_info_config_verify: false
    network_devices_info_config:
      - network_devices:
          - device_role: ACCESS
            device_identifier:
              - ip_address:
                  - "{{ switch_refresh_new_management_ip }}"
            timeout: "{{ refresh_item.device_info_lookup_timeout | default(switch_refresh_device_info_lookup_timeout) }}"
            retries: "{{ refresh_item.device_info_lookup_retries | default(switch_refresh_device_info_lookup_retries) }}"
            interval: "{{ refresh_item.device_info_lookup_interval | default(switch_refresh_device_info_lookup_interval) }}"
            requested_info:
              - device_info
  when: switch_refresh_device_info_lookup_enabled | bool

- name: Validate replacement switch inventory lookup result
  ansible.builtin.assert:
    that:
      - network_devices_info_result.response is defined
      - network_devices_info_result.response | length > 1
      - network_devices_info_result.response[1] | length > 0
      - network_devices_info_result.response[1][0].device_info is defined
      - network_devices_info_result.response[1][0].device_info | length == 1
      - network_devices_info_result.response[1][0].device_info[0].device_details | length == 1
      - >-
        (network_devices_info_result.response[1][0].device_info[0].device_details[0].role |
        default('') | upper) == 'ACCESS'
    fail_msg: >-
      Unable to resolve exactly one replacement switch from Catalyst Center
      inventory with management IP {{ switch_refresh_new_management_ip }} and
      inventory role ACCESS.
  when: switch_refresh_device_info_lookup_enabled | bool

- name: Set replacement switch resolved details
  ansible.builtin.set_fact:
    switch_refresh_new_device_details: "{{ network_devices_info_result.response[1][0].device_info[0].device_details[0] }}"
  when: switch_refresh_device_info_lookup_enabled | bool

- name: Build replacement switch provision configuration
  ansible.builtin.set_fact:
    switch_refresh_new_provision_config: >-
      {{
        refresh_item.new.provision_config | default([
          {
            'site_name_hierarchy': refresh_item.provision_site_name_hierarchy | default(refresh_item.fabric_site_name_hierarchy),
            'management_ip_address': switch_refresh_new_management_ip
          }
        ])
      }}
  when: switch_refresh_provision_enabled | bool

- name: Provision replacement switch
  ansible.builtin.include_role:
    name: provision
    apply:
      tags:
        - switch_refresh_prepare
  vars:
    provision_state: merged
    provision_config_verify: "{{ switch_refresh_provision_config_verify }}"
    provision_config: "{{ switch_refresh_new_provision_config }}"
  when: switch_refresh_provision_enabled | bool

- name: Build replacement fabric edge configuration
  ansible.builtin.set_fact:
    switch_refresh_new_fabric_devices_config: >-
      {{
        refresh_item.new.fabric_devices_config | default([
          {
            'fabric_devices': {
              'fabric_name': refresh_item.fabric_site_name_hierarchy,
              'device_config': [
                {
                  'device_ip': switch_refresh_new_management_ip,
                  'device_roles': refresh_item.new.device_roles | default(['EDGE_NODE'])
                }
              ]
            }
          }
        ])
      }}
  when: switch_refresh_fabric_add_enabled | bool

- name: Add replacement switch to fabric as edge device
  ansible.builtin.include_role:
    name: sda_fabric_devices
    apply:
      tags:
        - switch_refresh_prepare
  vars:
    sda_fabric_devices_state: merged
    sda_fabric_devices_config_verify: "{{ switch_refresh_sda_fabric_devices_config_verify }}"
    sda_fabric_devices_config: "{{ switch_refresh_new_fabric_devices_config }}"
  when: switch_refresh_fabric_add_enabled | bool

- name: Validate replacement switch is present in fabric
  ansible.builtin.include_role:
    name: fabric_devices_info
    apply:
      tags:
        - switch_refresh_prepare
  vars:
    fabric_devices_info_state: gathered
    fabric_devices_info_config_verify: false
    fabric_devices_info_config:
      - fabric_devices:
          - fabric_site_hierarchy: "{{ refresh_item.fabric_site_name_hierarchy }}"
            fabric_device_role: "{{ refresh_item.fabric_validation_role | default('EDGE_NODE') }}"
            device_identifier:
              - ip_address:
                  - "{{ switch_refresh_new_management_ip }}"
            timeout: "{{ refresh_item.fabric_validation_timeout | default(switch_refresh_fabric_validation_timeout) }}"
            retries: "{{ refresh_item.fabric_validation_retries | default(switch_refresh_fabric_validation_retries) }}"
            interval: "{{ refresh_item.fabric_validation_interval | default(switch_refresh_fabric_validation_interval) }}"
            requested_info:
              - fabric_info
  when:
    - switch_refresh_fabric_add_enabled | bool
    - switch_refresh_fabric_validation_enabled | bool

- name: Validate replacement switch fabric response
  ansible.builtin.include_tasks: validate_batch_fabric_result.yml
  vars:
    switch_refresh_batch_device_ips:
      - "{{ switch_refresh_new_management_ip }}"
  when:
    - switch_refresh_fabric_add_enabled | bool
    - switch_refresh_fabric_validation_enabled | bool

- name: Build host-port migration generator config
  ansible.builtin.set_fact:
    switch_refresh_migration_config:
      component_specific_filters:
        port_assignments:
          - fabric_site_name_hierarchy: "{{ refresh_item.fabric_site_name_hierarchy }}"
            source_device_ip: "{{ switch_refresh_old_management_ip }}"
            destination_device_ip: "{{ switch_refresh_new_management_ip }}"
            interface_mappings: "{{ switch_refresh_port_assignment_interface_mappings }}"
        port_channels:
          - fabric_site_name_hierarchy: "{{ refresh_item.fabric_site_name_hierarchy }}"
            source_device_ip: "{{ switch_refresh_old_management_ip }}"
            destination_device_ip: "{{ switch_refresh_new_management_ip }}"
            interface_mappings: "{{ switch_refresh_port_channel_interface_mappings }}"
  when: switch_refresh_host_onboarding_enabled | bool

- name: Remove stale replacement host-port onboarding payload
  ansible.builtin.file:
    path: "{{ switch_refresh_migration_output_file }}"
    state: absent
  when: switch_refresh_host_onboarding_enabled | bool

- name: Generate replacement host-port onboarding payload
  ansible.builtin.include_role:
    name: sda_host_port_migration_config_generator
    apply:
      tags:
        - switch_refresh_prepare
  vars:
    sda_host_port_migration_config_generator_state: gathered
    sda_host_port_migration_config_generator_file_path: "{{ switch_refresh_migration_output_file }}"
    sda_host_port_migration_config_generator_file_mode: overwrite
    sda_host_port_migration_config_generator_config: "{{ switch_refresh_migration_config }}"
  when: switch_refresh_host_onboarding_enabled | bool

- name: Check generated replacement host-port onboarding payload
  ansible.builtin.stat:
    path: "{{ switch_refresh_migration_output_file }}"
  register: switch_refresh_migration_output_stat
  when: switch_refresh_host_onboarding_enabled | bool

- name: Validate generated replacement host-port onboarding file
  ansible.builtin.assert:
    that:
      - >-
        switch_refresh_allow_empty_host_port_config | bool or
        (
          switch_refresh_migration_output_stat.stat.exists and
          (switch_refresh_migration_output_stat.stat.isreg | default(false))
        )
    fail_msg: >-
      Host-port migration did not generate a fresh output file for
      {{ switch_refresh_item_name }}.
  when: switch_refresh_host_onboarding_enabled | bool

- name: Load generated replacement host-port onboarding payload
  ansible.builtin.include_vars:
    file: "{{ switch_refresh_migration_output_file }}"
    name: switch_refresh_generated_host_onboarding
  when:
    - switch_refresh_host_onboarding_enabled | bool
    - switch_refresh_migration_output_stat.stat.exists

- name: Set empty replacement host-port onboarding payload
  ansible.builtin.set_fact:
    switch_refresh_generated_host_onboarding:
      config: []
  when:
    - switch_refresh_host_onboarding_enabled | bool
    - not (switch_refresh_migration_output_stat.stat.exists | bool)
    - switch_refresh_allow_empty_host_port_config | bool

- name: Validate generated replacement host-port onboarding payload
  ansible.builtin.assert:
    that:
      - switch_refresh_generated_host_onboarding.config is defined
      - (switch_refresh_generated_host_onboarding.config | type_debug) == 'list'
      - switch_refresh_allow_empty_host_port_config | bool or (switch_refresh_generated_host_onboarding.config | length > 0)
    fail_msg: >-
      Host-port migration did not generate an onboarding config for
      {{ switch_refresh_item_name }}. Confirm the old switch has port
      assignments or port channels in the supplied fabric site.
  when: switch_refresh_host_onboarding_enabled | bool

- name: Validate generated replacement host-port onboarding target
  ansible.builtin.assert:
    that:
      - >-
        switch_refresh_generated_host_onboarding.config | length == 0 or
        (
          switch_refresh_generated_host_onboarding.config |
          map(attribute='ip_address') |
          map('string') |
          unique |
          list == [switch_refresh_new_management_ip]
        )
    fail_msg: >-
      A non-empty generated host onboarding payload must target only replacement
      switch {{ switch_refresh_new_management_ip }}.
  when: switch_refresh_host_onboarding_enabled | bool

- name: Push replacement host-port onboarding config
  ansible.builtin.include_role:
    name: sda_host_port_onboarding
    apply:
      tags:
        - switch_refresh_prepare
  vars:
    sda_host_port_onboarding_state: merged
    sda_host_port_onboarding_config_verify: "{{ switch_refresh_sda_host_port_onboarding_config_verify }}"
    sda_host_port_onboarding_sda_fabric_port_channel_limit: "{{ switch_refresh_sda_fabric_port_channel_limit }}"
    sda_host_port_onboarding_config: "{{ switch_refresh_generated_host_onboarding.config }}"
  when:
    - switch_refresh_host_onboarding_enabled | bool
    - switch_refresh_generated_host_onboarding.config | length > 0

- name: Record replacement switch prepare result
  ansible.builtin.set_fact:
    switch_refresh_prepare_results: >-
      {{
        (switch_refresh_prepare_results | default([])) + [
          {
            'name': switch_refresh_item_name,
            'old_management_ip': switch_refresh_old_management_ip,
            'new_management_ip': switch_refresh_new_management_ip,
            'fabric_site_name_hierarchy': refresh_item.fabric_site_name_hierarchy,
            'migration_output_file': switch_refresh_migration_output_file
          }
        ]
