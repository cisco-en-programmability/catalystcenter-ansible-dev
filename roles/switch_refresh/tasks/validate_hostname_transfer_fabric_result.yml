---
# Validate the response emitted by the fabric_devices_info role against the
# exact hostname-transfer replacement target set.
- name: Initialize replacement hostname fabric records
  ansible.builtin.set_fact:
    switch_refresh_hostname_fabric_info_entries: []

- name: Extract replacement hostname fabric records
  ansible.builtin.set_fact:
    switch_refresh_hostname_fabric_info_entries: >-
      {{
        switch_refresh_hostname_fabric_info_entries +
        switch_refresh_hostname_fabric_response_item[0].fabric_info
      }}
  loop: "{{ fabric_devices_info_result.response | default([]) }}"
  loop_control:
    loop_var: switch_refresh_hostname_fabric_response_item
    label: hostname-transfer-fabric-response
  when:
    - (switch_refresh_hostname_fabric_response_item | type_debug) == 'list'
    - switch_refresh_hostname_fabric_response_item | length > 0
    - switch_refresh_hostname_fabric_response_item[0] is mapping
    - switch_refresh_hostname_fabric_response_item[0].fabric_info is defined
    - >-
      (switch_refresh_hostname_fabric_response_item[0].fabric_info | type_debug)
      == 'list'

- name: Validate exact replacement EDGE_NODE fabric coverage
  ansible.builtin.assert:
    that:
      - fabric_devices_info_result.response is defined
      - >-
        switch_refresh_hostname_fabric_info_entries | length ==
        switch_refresh_hostname_fabric_expected_ips | length
      - >-
        switch_refresh_hostname_fabric_info_entries |
        map(attribute='device_ip') |
        map('string') |
        unique |
        list |
        length == switch_refresh_hostname_fabric_expected_ips | length
      - >-
        switch_refresh_hostname_fabric_info_entries |
        map(attribute='device_ip') |
        map('string') |
        list |
        sort == switch_refresh_hostname_fabric_expected_ips | sort
    fail_msg: >-
      Hostname transfer did not find every replacement as an EDGE_NODE in
      fabric {{ switch_refresh_hostname_fabric_site }} during
      {{ switch_refresh_hostname_fabric_validation_context |
      default('validation') }}. No hostname update was submitted.

- name: Validate replacement hostname EDGE_NODE records
  ansible.builtin.assert:
    that:
      - (switch_refresh_hostname_fabric_info_item.fabric_details | type_debug)
        == 'list'
      - switch_refresh_hostname_fabric_info_item.fabric_details | length > 0
      - >-
        switch_refresh_hostname_fabric_info_item.fabric_details |
        selectattr('deviceRoles', 'defined') |
        list |
        length == switch_refresh_hostname_fabric_info_item.fabric_details |
        length
      - >-
        'EDGE_NODE' in
        (
          switch_refresh_hostname_fabric_info_item.fabric_details |
          map(attribute='deviceRoles') |
          list |
          flatten |
          map('upper') |
          list
        )
    fail_msg: >-
      Hostname transfer received an invalid or non-EDGE_NODE record for replacement
      {{ switch_refresh_hostname_fabric_info_item.device_ip |
      default('unknown') }} during
      {{ switch_refresh_hostname_fabric_validation_context |
      default('validation') }}.
  loop: "{{ switch_refresh_hostname_fabric_info_entries }}"
  loop_control:
    loop_var: switch_refresh_hostname_fabric_info_item
    label: >-
      {{ switch_refresh_hostname_fabric_info_item.device_ip |
      default('replacement-device') }}
