---
- name: Validate border refresh device mapping structure
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_border_input_mapping is mapping
    fail_msg: Each device_mapping entry must be a mapping.

- name: Derive old border identifier
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_border_mapping_old_identifier: >-
      {{ switch_refresh_sda_fabric_border_input_mapping.old | default({}) }}

- name: Validate border refresh device mapping
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_border_input_mapping.new_device_management_ip is defined
      - switch_refresh_sda_fabric_border_input_mapping.new_device_management_ip is string
      - >-
        switch_refresh_sda_fabric_border_input_mapping.new_device_management_ip |
        trim | length > 0
      - >-
        switch_refresh_sda_fabric_border_input_mapping.new_device_management_ip ==
        (switch_refresh_sda_fabric_border_input_mapping.new_device_management_ip | trim)
      - >-
        switch_refresh_sda_fabric_border_input_mapping.new_device_management_ip in
        switch_refresh_sda_fabric_border_batch_device_ips
      - switch_refresh_sda_fabric_border_input_mapping.old is defined
      - >-
        switch_refresh_sda_fabric_border_input_mapping.keys() |
        list |
        difference(
          ['old', 'new_device_management_ip', 'handoff_interface_mappings']
        ) |
        length == 0
      - switch_refresh_sda_fabric_border_mapping_old_identifier is mapping
      - >-
        switch_refresh_sda_fabric_border_mapping_old_identifier.keys() |
        list |
        difference(['management_ip', 'hostname', 'serial_number', 'mac_address']) |
        length == 0
      - >-
        (
          [
            switch_refresh_sda_fabric_border_mapping_old_identifier.management_ip
              is defined,
            switch_refresh_sda_fabric_border_mapping_old_identifier.hostname
              is defined,
            switch_refresh_sda_fabric_border_mapping_old_identifier.serial_number
              is defined,
            switch_refresh_sda_fabric_border_mapping_old_identifier.mac_address
              is defined
          ] |
          select('equalto', true) |
          list |
          length
        ) == 1
      - >-
        (switch_refresh_sda_fabric_border_mapping_old_identifier.values() |
        first) is string
      - >-
        switch_refresh_sda_fabric_border_mapping_old_identifier.values() |
        first | default('') | trim | length > 0
      - >-
        switch_refresh_sda_fabric_border_mapping_old_identifier.values() | first ==
        (switch_refresh_sda_fabric_border_mapping_old_identifier.values() |
        first | trim)
      - >-
        switch_refresh_sda_fabric_border_mapping_old_identifier.management_ip is not defined or
        (
          switch_refresh_sda_fabric_border_mapping_old_identifier.management_ip |
          regex_search(
            '^(?:0|[1-9][0-9]{0,2})(?:\\.(?:0|[1-9][0-9]{0,2})){3}$'
          ) is not none
        )
      - >-
        switch_refresh_sda_fabric_border_mapping_old_identifier.management_ip is not defined or
        (
          switch_refresh_sda_fabric_border_mapping_old_identifier.management_ip |
          split('.') | map('int') | max <= 255
        )
      - >-
        switch_refresh_sda_fabric_border_mapping_old_identifier.management_ip is not defined or
        (
          switch_refresh_sda_fabric_border_mapping_old_identifier.management_ip not in
          switch_refresh_sda_fabric_border_batch_device_ips
        )
      - >-
        switch_refresh_sda_fabric_border_mapping_old_identifier.mac_address is not defined or
        (
          switch_refresh_sda_fabric_border_mapping_old_identifier.mac_address |
          regex_search('^(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$')
          is not none
        )
      - >-
        (switch_refresh_sda_fabric_border_input_mapping.handoff_interface_mappings |
        default([]) | type_debug) == 'list'
    fail_msg: >-
      Each device_mapping entry must target one IP from new_devices.device_ips,
      identify one old device with exactly one non-empty management_ip,
      hostname, serial_number, or mac_address selector, and contain only the
      supported keys. handoff_interface_mappings must be a list. Old and new
      management IPs cannot overlap within a batch.

- name: Normalize old border identifier
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_border_mapping_normalized_old_identifier: >-
      {{
        {
          'management_ip':
            switch_refresh_sda_fabric_border_mapping_old_identifier.management_ip
        }
        if (switch_refresh_sda_fabric_border_mapping_old_identifier.management_ip is defined)
        else {
          'hostname': switch_refresh_sda_fabric_border_mapping_old_identifier.hostname
        }
        if (switch_refresh_sda_fabric_border_mapping_old_identifier.hostname is defined)
        else {
          'serial_number':
            switch_refresh_sda_fabric_border_mapping_old_identifier.serial_number | upper
        }
        if (switch_refresh_sda_fabric_border_mapping_old_identifier.serial_number is defined)
        else {
          'mac_address':
            switch_refresh_sda_fabric_border_mapping_old_identifier.mac_address |
            lower |
            regex_replace('-', ':')
        }
      }}
    switch_refresh_sda_fabric_border_effective_handoff_interface_mappings: >-
      {{
        switch_refresh_sda_fabric_border_input_mapping.handoff_interface_mappings |
        default([])
      }}

- name: Validate border handoff interface mapping entry types
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_border_interface_mapping is mapping
    fail_msg: >-
      Every handoff interface mapping must be a mapping containing a source
      and destination interface name.
  loop: "{{ switch_refresh_sda_fabric_border_effective_handoff_interface_mappings }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_border_interface_mapping
    label: >-
      {{
        switch_refresh_sda_fabric_border_interface_mapping.source_interface_name |
        default('invalid-interface-mapping')
        if (switch_refresh_sda_fabric_border_interface_mapping is mapping)
        else 'invalid-interface-mapping'
      }}

- name: Validate border handoff interface mapping entries
  ansible.builtin.assert:
    that:
      - >-
        switch_refresh_sda_fabric_border_interface_mapping.keys() |
        list |
        difference(['source_interface_name', 'destination_interface_name']) |
        length == 0
      - switch_refresh_sda_fabric_border_interface_mapping.source_interface_name is defined
      - switch_refresh_sda_fabric_border_interface_mapping.destination_interface_name is defined
      - switch_refresh_sda_fabric_border_interface_mapping.source_interface_name is string
      - >-
        switch_refresh_sda_fabric_border_interface_mapping.destination_interface_name
        is string
      - >-
        switch_refresh_sda_fabric_border_interface_mapping.source_interface_name |
        trim | length > 0
      - >-
        switch_refresh_sda_fabric_border_interface_mapping.destination_interface_name |
        trim | length > 0
      - >-
        switch_refresh_sda_fabric_border_interface_mapping.source_interface_name ==
        (switch_refresh_sda_fabric_border_interface_mapping.source_interface_name | trim)
      - >-
        switch_refresh_sda_fabric_border_interface_mapping.destination_interface_name ==
        (switch_refresh_sda_fabric_border_interface_mapping.destination_interface_name | trim)
    fail_msg: >-
      Every handoff interface mapping must contain only non-empty,
      whitespace-trimmed source_interface_name and destination_interface_name
      strings.
  loop: "{{ switch_refresh_sda_fabric_border_effective_handoff_interface_mappings }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_border_interface_mapping
    label: >-
      {{
        switch_refresh_sda_fabric_border_interface_mapping.source_interface_name |
        default('invalid-interface-mapping')
      }}

- name: Validate unique border handoff interface mappings
  ansible.builtin.assert:
    that:
      - >-
        switch_refresh_sda_fabric_border_effective_handoff_interface_mappings |
        map(attribute='source_interface_name') |
        map('lower') |
        unique |
        length ==
        switch_refresh_sda_fabric_border_effective_handoff_interface_mappings | length
      - >-
        switch_refresh_sda_fabric_border_effective_handoff_interface_mappings |
        map(attribute='destination_interface_name') |
        map('lower') |
        unique |
        length ==
        switch_refresh_sda_fabric_border_effective_handoff_interface_mappings | length
    fail_msg: >-
      handoff_interface_mappings must use unique source and destination
      interface names for each replacement device.

- name: Add normalized border refresh device mapping
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_border_batch_device_mappings: >-
      {{
        switch_refresh_sda_fabric_border_batch_device_mappings +
        [
          {
            'old': switch_refresh_sda_fabric_border_mapping_normalized_old_identifier,
            'new_device_management_ip':
              switch_refresh_sda_fabric_border_input_mapping.new_device_management_ip,
            'handoff_interface_mappings':
              switch_refresh_sda_fabric_border_effective_handoff_interface_mappings
          }
        ]
      }}
