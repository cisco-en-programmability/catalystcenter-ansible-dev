---
# Input:
#   switch_refresh_sda_fabric_border_redundancy_request:
#     fabric_name: <fabric site hierarchy>
#     excluded_device_ips: [<current old IP>, <current replacement IP>]
#     capture_file: <unique absolute generator output path>
# Output:
#   switch_refresh_sda_fabric_border_redundancy_result

- name: Validate border redundancy request
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_border_redundancy_request is mapping
      - >-
        switch_refresh_sda_fabric_border_redundancy_request.fabric_name |
        default('') | string | trim | length > 0
      - >-
        (switch_refresh_sda_fabric_border_redundancy_request.excluded_device_ips |
        default([]) | type_debug) == 'list'
      - >-
        switch_refresh_sda_fabric_border_redundancy_request.capture_file |
        default('') | string | regex_search('^/') is not none
    fail_msg: >-
      Site border redundancy validation requires a fabric, an exclusion list,
      and an absolute unique generator output file.

- name: Normalize border redundancy request
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_border_redundancy_fabric: >-
      {{ switch_refresh_sda_fabric_border_redundancy_request.fabric_name }}
    switch_refresh_sda_fabric_border_redundancy_excluded_ips: >-
      {{
        switch_refresh_sda_fabric_border_redundancy_request.excluded_device_ips |
        map('string') | unique | list
      }}
    switch_refresh_sda_fabric_border_redundancy_capture_file: >-
      {{ switch_refresh_sda_fabric_border_redundancy_request.capture_file }}

- name: Create protected redundancy capture directory
  ansible.builtin.file:
    path: "{{ switch_refresh_sda_fabric_border_redundancy_capture_file | dirname }}"
    state: directory
    mode: "0700"

- name: Remove prior unique redundancy capture
  ansible.builtin.file:
    path: "{{ switch_refresh_sda_fabric_border_redundancy_capture_file }}"
    state: absent

- name: Generate site-wide border configuration for redundancy validation
  ansible.builtin.include_role:
    name: sda_fabric_devices_config_generator
    apply:
      tags:
        - switch_refresh_sda_fabric_border_cutover
      no_log: true
  vars:
    catalystcenter_debug: false
    catalystcenter_log: false
    sda_fabric_devices_config_generator_state: gathered
    sda_fabric_devices_config_generator_file_mode: overwrite
    sda_fabric_devices_config_generator_file_path: >-
      {{ switch_refresh_sda_fabric_border_redundancy_capture_file }}
    sda_fabric_devices_config_generator_config:
      component_specific_filters:
        components_list:
          - fabric_devices
        fabric_devices:
          - fabric_name: "{{ switch_refresh_sda_fabric_border_redundancy_fabric }}"
            device_roles:
              - BORDER_NODE
  no_log: true

- name: Inspect site-wide border generator artifact
  ansible.builtin.stat:
    path: "{{ switch_refresh_sda_fabric_border_redundancy_capture_file }}"
    follow: false
  register: switch_refresh_sda_fabric_border_redundancy_stat

- name: Validate site-wide border generator artifact type
  ansible.builtin.assert:
    that:
      - >-
        not (switch_refresh_sda_fabric_border_redundancy_stat.stat.exists | bool) or
        (
          switch_refresh_sda_fabric_border_redundancy_stat.stat.isreg |
          default(false) | bool
        )
      - >-
        not (
          switch_refresh_sda_fabric_border_redundancy_stat.stat.islnk |
          default(false) | bool
        )
    fail_msg: The site-wide generator output must be a regular, non-symlink file.

- name: Protect site-wide border generator artifact
  ansible.builtin.file:
    path: "{{ switch_refresh_sda_fabric_border_redundancy_capture_file }}"
    state: file
    mode: "0600"
  when: switch_refresh_sda_fabric_border_redundancy_stat.stat.exists | bool

- name: Initialize empty site-wide border generator document
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_border_redundancy_document:
      config: []
  no_log: true

- name: Read site-wide border generator artifact
  ansible.builtin.slurp:
    src: "{{ switch_refresh_sda_fabric_border_redundancy_capture_file }}"
  register: switch_refresh_sda_fabric_border_redundancy_slurp
  when: switch_refresh_sda_fabric_border_redundancy_stat.stat.exists | bool
  no_log: true

- name: Parse site-wide border generator artifact
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_border_redundancy_document: >-
      {{
        switch_refresh_sda_fabric_border_redundancy_slurp.content |
        b64decode | from_yaml
      }}
  when: switch_refresh_sda_fabric_border_redundancy_stat.stat.exists | bool
  no_log: true

- name: Validate site-wide border generator envelope
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_border_redundancy_document is mapping
      - switch_refresh_sda_fabric_border_redundancy_document.config is defined
      - >-
        (switch_refresh_sda_fabric_border_redundancy_document.config |
        type_debug) == 'list'
    fail_msg: >-
      The generator returned an invalid site-wide border document for
      {{ switch_refresh_sda_fabric_border_redundancy_fabric }}.

- name: Initialize site-wide operational border candidates
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_border_redundancy_device_records: []
    switch_refresh_sda_fabric_border_redundancy_operational_ips: []
  no_log: true

- name: Collect site-wide border device records
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_border_redundancy_device_records: >-
      {{
        switch_refresh_sda_fabric_border_redundancy_device_records +
        switch_refresh_sda_fabric_border_redundancy_config_item
        .fabric_devices.device_config
      }}
  loop: "{{ switch_refresh_sda_fabric_border_redundancy_document.config }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_border_redundancy_config_item
    label: site-wide-border-record
  when:
    - switch_refresh_sda_fabric_border_redundancy_config_item is mapping
    - switch_refresh_sda_fabric_border_redundancy_config_item.fabric_devices is defined
    - switch_refresh_sda_fabric_border_redundancy_config_item.fabric_devices is mapping
    - >-
      switch_refresh_sda_fabric_border_redundancy_config_item
      .fabric_devices.fabric_name | default('') ==
      switch_refresh_sda_fabric_border_redundancy_fabric
    - >-
      (switch_refresh_sda_fabric_border_redundancy_config_item
      .fabric_devices.device_config | default([]) | type_debug) == 'list'
  no_log: true

- name: Validate site-wide border device record shapes
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_border_redundancy_device is mapping
      - >-
        switch_refresh_sda_fabric_border_redundancy_device.device_ip |
        default('') | string | trim | length > 0
      - >-
        (switch_refresh_sda_fabric_border_redundancy_device.device_roles |
        default([]) | type_debug) == 'list'
      - >-
        'BORDER_NODE' in
        (switch_refresh_sda_fabric_border_redundancy_device.device_roles | default([]))
      - >-
        switch_refresh_sda_fabric_border_redundancy_device.borders_settings |
        default({}) is mapping
    fail_msg: >-
      The site-wide generator returned a malformed border record for
      {{ switch_refresh_sda_fabric_border_redundancy_fabric }}.
  loop: "{{ switch_refresh_sda_fabric_border_redundancy_device_records }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_border_redundancy_device
    label: >-
      {{ switch_refresh_sda_fabric_border_redundancy_device.device_ip |
      default('invalid-border') }}

- name: Collect operational borders outside the current old/new pair
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_border_redundancy_operational_ips: >-
      {{
        switch_refresh_sda_fabric_border_redundancy_operational_ips +
        [switch_refresh_sda_fabric_border_redundancy_device.device_ip | string]
      }}
  loop: "{{ switch_refresh_sda_fabric_border_redundancy_device_records }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_border_redundancy_device
    label: "{{ switch_refresh_sda_fabric_border_redundancy_device.device_ip }}"
  when:
    - >-
      switch_refresh_sda_fabric_border_redundancy_device.device_ip | string not in
      switch_refresh_sda_fabric_border_redundancy_excluded_ips
    - >-
      (
        switch_refresh_sda_fabric_border_redundancy_device
        .borders_settings.layer2_handoff | default([]) | length > 0
      ) or (
        switch_refresh_sda_fabric_border_redundancy_device
        .borders_settings.layer3_handoff_ip_transit | default([]) | length > 0
      ) or (
        switch_refresh_sda_fabric_border_redundancy_device
        .borders_settings.layer3_handoff_sda_transit | default({}) | length > 0
      )

- name: Require another configured border with handoff before destructive cutover
  ansible.builtin.assert:
    that:
      - >-
        switch_refresh_sda_fabric_border_redundancy_operational_ips |
        unique | length > 0
    fail_msg: >-
      No border outside the current old/new pair with a non-empty handoff remains in
      {{ switch_refresh_sda_fabric_border_redundancy_fabric }}. Set
      switch_refresh_sda_fabric_border_allow_single_border_outage=true only
      after explicitly approving the resulting border outage.

- name: Query inventory state for configured peer borders
  ansible.builtin.include_role:
    name: network_devices_info
    apply:
      tags:
        - switch_refresh_sda_fabric_border_cutover
  vars:
    network_devices_info_state: gathered
    network_devices_info_config_verify: false
    network_devices_info_config:
      - network_devices:
          - device_identifier:
              - ip_address: >-
                  {{
                    switch_refresh_sda_fabric_border_redundancy_operational_ips |
                    unique | sort
                  }}
            timeout: "{{ switch_refresh_sda_fabric_border_device_info_lookup_timeout }}"
            retries: "{{ switch_refresh_sda_fabric_border_device_info_lookup_retries }}"
            interval: "{{ switch_refresh_sda_fabric_border_device_info_lookup_interval }}"
            requested_info:
              - device_info
  no_log: true

- name: Initialize reachable peer border inventory records
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_border_redundancy_inventory_records: []
    switch_refresh_sda_fabric_border_redundancy_reachable_ips: []
  no_log: true

- name: Extract configured peer border inventory records
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_border_redundancy_inventory_records: >-
      {{
        switch_refresh_sda_fabric_border_redundancy_inventory_records +
        switch_refresh_sda_fabric_border_redundancy_response_item[0].device_info
      }}
  loop: "{{ (network_devices_info_result | default({})).response | default([]) }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_border_redundancy_response_item
    label: peer-border-inventory-response
  when:
    - >-
      (switch_refresh_sda_fabric_border_redundancy_response_item | type_debug) ==
      'list'
    - switch_refresh_sda_fabric_border_redundancy_response_item | length > 0
    - switch_refresh_sda_fabric_border_redundancy_response_item[0] is mapping
    - switch_refresh_sda_fabric_border_redundancy_response_item[0].device_info is defined
    - >-
      (switch_refresh_sda_fabric_border_redundancy_response_item[0].device_info |
      type_debug) == 'list'
  no_log: true

- name: Validate configured peer border inventory envelopes
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_border_redundancy_inventory_record is mapping
      - >-
        switch_refresh_sda_fabric_border_redundancy_inventory_record.device_ip |
        default('') | string in
        switch_refresh_sda_fabric_border_redundancy_operational_ips
      - >-
        (switch_refresh_sda_fabric_border_redundancy_inventory_record.device_details |
        default([]) | type_debug) == 'list'
      - >-
        switch_refresh_sda_fabric_border_redundancy_inventory_record.device_details |
        default([]) | length == 1
      - >-
        switch_refresh_sda_fabric_border_redundancy_inventory_record.device_details[0]
        is mapping
    fail_msg: >-
      Inventory lookup returned a malformed or out-of-scope configured peer
      border record before destructive cutover.
  loop: "{{ switch_refresh_sda_fabric_border_redundancy_inventory_records }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_border_redundancy_inventory_record
    label: >-
      {{
        switch_refresh_sda_fabric_border_redundancy_inventory_record.device_ip |
        default('invalid-peer-border')
      }}

- name: Collect managed and reachable configured peer borders
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_border_redundancy_reachable_ips: >-
      {{
        switch_refresh_sda_fabric_border_redundancy_reachable_ips +
        [switch_refresh_sda_fabric_border_redundancy_inventory_record.device_ip | string]
      }}
  loop: "{{ switch_refresh_sda_fabric_border_redundancy_inventory_records }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_border_redundancy_inventory_record
    label: "{{ switch_refresh_sda_fabric_border_redundancy_inventory_record.device_ip }}"
  vars:
    switch_refresh_sda_fabric_border_redundancy_inventory_detail: >-
      {{ switch_refresh_sda_fabric_border_redundancy_inventory_record.device_details[0] }}
  when:
    - >-
      switch_refresh_sda_fabric_border_redundancy_inventory_detail.managementState |
      default(
        switch_refresh_sda_fabric_border_redundancy_inventory_detail.collectionStatus |
        default(''),
        true
      ) | string | lower == 'managed'
    - >-
      switch_refresh_sda_fabric_border_redundancy_inventory_detail.reachabilityStatus |
      default('') | string | upper in ['REACHABLE', 'PING REACHABLE']
  no_log: true

- name: Require a managed and reachable configured peer border
  ansible.builtin.assert:
    that:
      - >-
        switch_refresh_sda_fabric_border_redundancy_reachable_ips |
        unique | length > 0
    fail_msg: >-
      Peer borders with configured handoffs exist, but none is currently
      Managed and Reachable or Ping Reachable. The old border was not deleted.

- name: Publish site border redundancy result
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_border_redundancy_result:
      fabric_name: "{{ switch_refresh_sda_fabric_border_redundancy_fabric }}"
      excluded_device_ips: >-
        {{ switch_refresh_sda_fabric_border_redundancy_excluded_ips }}
      operational_border_ips: >-
        {{
          switch_refresh_sda_fabric_border_redundancy_operational_ips |
          unique | sort
        }}
      reachable_operational_border_ips: >-
        {{
          switch_refresh_sda_fabric_border_redundancy_reachable_ips |
          unique | sort
        }}
      validated: true
  no_log: true
