---
# Catalyst Center connection settings.
catalystcenter_host: ""
catalystcenter_username: ""
catalystcenter_password: ""
catalystcenter_verify: false
catalystcenter_port: 443
catalystcenter_version: "2.3.7.9"
catalystcenter_debug: false
catalystcenter_log_level: "INFO"
catalystcenter_log: false
catalystcenter_log_append: false
catalystcenter_log_file_path: catalystcenter.log

# Public workflow controls.
switch_refresh_sda_fabric_border_phase: prepare
switch_refresh_sda_fabric_border_batches: []
switch_refresh_sda_fabric_border_cutover_approved: false
switch_refresh_sda_fabric_border_resume_from_manifest: false
switch_refresh_sda_fabric_border_manifest_dir: ""
switch_refresh_sda_fabric_border_allow_single_border_outage: false
switch_refresh_sda_fabric_border_hostname_transfer_enabled: false

# Replacement onboarding and generated-stage defaults.
switch_refresh_sda_fabric_border_work_dir: /tmp/catalystcenter_switch_refresh_sda_fabric_border
switch_refresh_sda_fabric_border_onboarding_method: discovery
switch_refresh_sda_fabric_border_inventory_credentials: {}

switch_refresh_sda_fabric_border_discovery_enabled: true
switch_refresh_sda_fabric_border_lan_automation_enabled: true
switch_refresh_sda_fabric_border_inventory_enabled: true
switch_refresh_sda_fabric_border_inventory_role_update_enabled: true
switch_refresh_sda_fabric_border_provision_enabled: true
switch_refresh_sda_fabric_border_fabric_add_enabled: true
switch_refresh_sda_fabric_border_config_generator_enabled: true

# External workflow-manager verification remains disabled. The border role
# verifies its postconditions with generated configuration readback.
switch_refresh_sda_fabric_border_discovery_config_verify: false
switch_refresh_sda_fabric_border_lan_automation_config_verify: false
switch_refresh_sda_fabric_border_inventory_config_verify: false
switch_refresh_sda_fabric_border_provision_config_verify: false
switch_refresh_sda_fabric_border_sda_fabric_devices_config_verify: false

# Mandatory completion and identity barriers.
switch_refresh_sda_fabric_border_device_info_lookup_timeout: 120
switch_refresh_sda_fabric_border_device_info_lookup_retries: 6
switch_refresh_sda_fabric_border_device_info_lookup_interval: 10
switch_refresh_sda_fabric_border_inventory_readiness_timeout: 1200
switch_refresh_sda_fabric_border_inventory_readiness_poll_interval: 10
switch_refresh_sda_fabric_border_provision_validation_timeout: 1200
switch_refresh_sda_fabric_border_provision_validation_poll_interval: 10
switch_refresh_sda_fabric_border_lan_automation_completion_timeout: 604800
switch_refresh_sda_fabric_border_lan_automation_completion_poll_interval: 30

# Optional hostname-transfer polling controls.
switch_refresh_sda_fabric_border_hostname_transfer_timeout: 1200
switch_refresh_sda_fabric_border_hostname_transfer_poll_interval: 10
switch_refresh_sda_fabric_border_hostname_validation_retries: 12
switch_refresh_sda_fabric_border_hostname_validation_interval: 10
