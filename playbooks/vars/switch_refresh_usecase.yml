---
# Sample Catalyst Center connection values. Replace with vault variables or
# inventory variables in production.
catalystcenter_host: "<catalyst-center-ip-or-fqdn>"
catalystcenter_port: 443
catalystcenter_username: "<username>"
catalystcenter_password: "<password>"
catalystcenter_version: "2.3.7.9"
catalystcenter_verify: false
catalystcenter_debug: false
catalystcenter_log: false
catalystcenter_log_level: INFO

switch_refresh_work_dir: /tmp/catalystcenter_switch_refresh
switch_refresh_onboarding_method: discovery
# Inventory addition requires device CLI credentials. Store real values in
# Ansible Vault or inventory variables rather than in this file.
switch_refresh_inventory_credentials:
  username: "<switch-cli-username>"
  password: "<switch-cli-password>"
  enable_password: "<switch-enable-password>"
  cli_transport: ssh
  type: NETWORK_DEVICE
switch_refresh_device_info_lookup_enabled: true
switch_refresh_fabric_validation_enabled: true
switch_refresh_lan_automation_completion_timeout: 604800
switch_refresh_lan_automation_completion_poll_interval: 30
switch_refresh_sda_host_port_onboarding_config_verify: true
switch_refresh_sda_fabric_devices_config_verify: true
switch_refresh_provision_config_verify: true

switch_refresh_devices:
  - name: sjc-bldg23-edge-refresh
    fabric_site_name_hierarchy: Global/USA/SAN-JOSE/BLDG23
    onboarding_method: discovery

    # Authoritative replacement-device set. Without custom stage configs, the
    # role generates one multi-device payload for each workflow manager.
    new_devices:
      device_ips:
        - 10.10.10.20
        - 10.10.10.21

      # Optional generated-discovery overrides.
      # discovery_name: switch-refresh-sjc-bldg23
      # protocol_order: ssh
      # discovery_retry: 2
      # use_global_credentials: true

      # Optional complete Discovery workflow replacement. Use the flat list
      # accepted by discovery_workflow_manager.
      # discovery_config:
      #   - discovery_name: switch-refresh-sjc-bldg23
      #     discovery_type: MULTI RANGE
      #     ip_address_list:
      #       - 10.10.10.20
      #       - 10.10.10.21
      #     protocol_order: ssh
      #     retry: 2
      #     use_global_credentials: true

      # Optional batch inventory credential override.
      # inventory_credentials:
      #   username: "<switch-cli-username>"
      #   password: "<switch-cli-password>"
      #   enable_password: "<switch-enable-password>"
      #   cli_transport: ssh
      #   type: NETWORK_DEVICE

      # Optional complete inventory payload replacement. Its IP set must match
      # device_ips.
      # inventory_config:
      #   - ip_address_list:
      #       - 10.10.10.20
      #       - 10.10.10.21
      #     username: "<switch-cli-username>"
      #     password: "<switch-cli-password>"
      #     enable_password: "<switch-enable-password>"
      #     cli_transport: ssh
      #     type: NETWORK_DEVICE

      # Optional. Defaults to EDGE_NODE.
      # device_roles:
      #   - EDGE_NODE

      # Optional complete provision payload replacement.
      # provision_config:
      #   - site_name_hierarchy: Global/USA/SAN-JOSE/BLDG23
      #     management_ip_address: 10.10.10.20
      #   - site_name_hierarchy: Global/USA/SAN-JOSE/BLDG23
      #     management_ip_address: 10.10.10.21

      # Optional. Only use when you need a custom fabric device payload.
      # fabric_devices_config:
      #   - fabric_devices:
      #       fabric_name: Global/USA/SAN-JOSE/BLDG23
      #       device_config:
      #         - device_ip: 10.10.10.20
      #           device_roles:
      #             - EDGE_NODE
      #         - device_ip: 10.10.10.21
      #           device_roles:
      #             - EDGE_NODE

    # Old-device information is resolved only after new-device fabric
    # validation, immediately before migration generation and host onboarding.
    device_mapping:
      - old_device_hostname: SJ-EDGE-OLD-01.cisco.local
        new_device_management_ip: 10.10.10.20
        interface_mappings:
          - source_interface_name: GigabitEthernet1/0/1
            destination_interface_name: TenGigabitEthernet1/0/1
      - old:
          serial_number: FOC1234ABCD
        new_device_management_ip: 10.10.10.21
        interface_mappings: []

  # LAN Automation onboarding option.
  # Use this instead of discovery when the replacement switch should be
  # onboarded through Catalyst Center LAN Automation. Keep device_ips aligned
  # with discovery_devices management IPs so later stages can find the devices.
  # launch_and_wait must be the boolean true. The discovery_timeout below is in
  # minutes; the completion timeout above is in seconds.
  #
  # - name: sjc-edge-03-refresh-lan-auto
  #   fabric_site_name_hierarchy: Global/USA/SAN-JOSE/BLDG23
  #   onboarding_method: lan_automation
  #   new_devices:
  #     device_ips:
  #       - 204.1.1.13
  #     lan_automation_config:
  #       - lan_automation:
  #           discovered_device_site_name_hierarchy: Global/USA/SAN JOSE
  #           peer_device_management_ip_address: 91.1.1.2
  #           primary_device_management_ip_address: 204.1.1.4
  #           primary_device_interface_names:
  #             - HundredGigE1/0/2
  #           ip_pools:
  #             - ip_pool_name: underlay_sub
  #               ip_pool_role: MAIN_POOL
  #             - ip_pool_name: underlay_sub_small
  #               ip_pool_role: PHYSICAL_LINK_POOL
  #           multicast_enabled: true
  #           redistribute_isis_to_bgp: true
  #           host_name_prefix: San-Jose
  #           isis_domain_pwd: "<isis-domain-password>"
  #           discovery_level: 5
  #           discovery_timeout: 40
  #           discovery_devices:
  #             - device_serial_number: FXS2429Q0WE
  #               device_host_name: SR-LAN-9400X-EDGE1
  #               device_site_name_hierarchy: Global/USA/SAN JOSE/BLD20/BLD20_FLOOR1
  #               device_management_ip_address: 204.1.1.13
  #           launch_and_wait: true
  #           pnp_authorization: false
  #   device_mapping:
  #     - old_device_hostname: SJ-EDGE-OLD-03.cisco.local
  #       new_device_management_ip: 204.1.1.13
  #       interface_mappings:
  #         - source_interface_name: GigabitEthernet1/0/1
  #           destination_interface_name: TenGigabitEthernet1/0/1
