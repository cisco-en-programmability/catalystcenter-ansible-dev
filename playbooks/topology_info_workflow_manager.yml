---
- name: Gather topology information from Cisco Catalyst Center
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - credentials.yml
  tasks:
    - name: Gather topology information without creating a file
      cisco.catalystcenter.topology_info_workflow_manager:
        catalystcenter_host: "{{ catalystcenter_host }}"
        catalystcenter_username: "{{ catalystcenter_username }}"
        catalystcenter_password: "{{ catalystcenter_password }}"
        catalystcenter_verify: "{{ catalystcenter_verify }}"
        catalystcenter_port: "{{ catalystcenter_port }}"
        catalystcenter_version: "{{ catalystcenter_version }}"
        catalystcenter_debug: "{{ catalystcenter_debug }}"
        catalystcenter_log: true
        catalystcenter_log_level: DEBUG
        state: gathered
        config:
          - requested_info:
              - site_topology
              - physical_topology
              - network_health
              - vlan_details
            node_type: device
            output_file_info:
              file_path: "{{ playbook_dir }}/output/topology_snapshot"
              file_format: json
              file_mode: w
              timestamp: true
      # register: topology_result

