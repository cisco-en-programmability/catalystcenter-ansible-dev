---
- name: Prepare replacement switch for Catalyst Center switch refresh
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/switch_refresh_usecase.yml
  vars:
    switch_refresh_phase: prepare
    switch_refresh_cleanup_old: false
  roles:
    - role: switch_refresh
      tags:
        - switch_refresh_prepare
